name: CI

on:
  push:
  pull_request:

jobs:
  headless-tests:
    name: Headless tests (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.3", "4.7"]
    env:
      GODOT_BIN: ${{ github.workspace }}/.godot-bin/Godot_v${{ matrix.godot }}-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot ${{ matrix.godot }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-${{ matrix.godot }}-stable-linux-x86_64

      - name: Download Godot ${{ matrix.godot }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d .godot-bin
          chmod +x "$GODOT_BIN"
          # Keep Godot's filesystem scan out of the engine download.
          touch .godot-bin/.gdignore

      - name: Lint, unit tests and 100-turn headless simulation
        run: GODOT="$GODOT_BIN" tools/run_tests.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-godot-${{ matrix.godot }}
          path: tests/output/
          if-no-files-found: ignore

  proxy-tests:
    name: LLM proxy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the proxy tests
        working-directory: proxy
        run: node --test
